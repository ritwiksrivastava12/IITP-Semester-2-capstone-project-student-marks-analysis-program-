services:
  - type: web
    name: campusmarks-iitp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 4 --bind 0.0.0.0:$PORT wsgi:app
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
